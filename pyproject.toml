[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keygraph"
version = "0.1.0"
description = "Map a database's keys and the relations between tables (declared and inferred) so join paths can be found deterministically."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Karami" }]
dependencies = []

[project.optional-dependencies]
live = ["sqlalchemy>=2.0"]
yaml = ["pyyaml>=6"]

[project.scripts]
keygraph = "keygraph.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "playwright>=1.64.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
