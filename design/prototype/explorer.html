/* ===== keygraph components =====================================================
   Every class is prefixed kg-. Colours, sizes and timings come only from the
   variables above; never hard-code a value here. */

/* ---- Base ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--kg-canvas); color: var(--kg-text);
  font: var(--kg-type-body); font-family: var(--kg-font-sans);
  font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
::selection { background: var(--kg-accent-soft); color: var(--kg-text); }
:focus-visible { outline: 2px solid var(--kg-border-focus); outline-offset: 2px; border-radius: var(--kg-radius-sm); }
.kg-mono, code, kbd, pre { font-family: var(--kg-font-mono); font-variant-ligatures: none; }
.kg-num { font-variant-numeric: tabular-nums; }
.kg-muted { color: var(--kg-text-2); }
.kg-faint { color: var(--kg-text-3); }
.kg-overline { font: var(--kg-type-overline); letter-spacing: var(--kg-track-overline); text-transform: uppercase; color: var(--kg-text-3); }
.kg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.kg-icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.kg-icon--sm { width: 14px; height: 14px; }

/* ---- App shell: left rail | view (head + canvas) | context panel -------------- */
.kg-app { display: grid; grid-template-columns: var(--kg-size-rail) minmax(0, 1fr) minmax(var(--kg-size-panel-min), var(--kg-size-panel)); height: 100vh; min-width: 1200px; }
.kg-app--panel-closed { grid-template-columns: var(--kg-size-rail) minmax(0, 1fr) 0; }
.kg-view { display: grid; grid-template-rows: var(--kg-size-header) minmax(0, 1fr); min-width: 0; min-height: 0; }

/* ---- Header ----------------------------------------------------------------- */
.kg-header {
  display: flex; align-items: center; gap: var(--kg-space-3); padding: 0 var(--kg-space-4);
  background: var(--kg-surface); border-bottom: 1px solid var(--kg-border); position: relative; z-index: var(--kg-z-panel);
}
.kg-brand { display: flex; align-items: center; gap: var(--kg-space-2); color: var(--kg-text); text-decoration: none; flex: none; }
.kg-brand svg { height: 20px; width: auto; display: block; }
.kg-brand-meta { font: var(--kg-type-caption); color: var(--kg-text-3); font-family: var(--kg-font-mono); }
.kg-divider { width: 1px; align-self: stretch; margin: var(--kg-space-3) 0; background: var(--kg-border); flex: none; }
.kg-spacer { flex: 1; }
.kg-toolbar { display: flex; align-items: center; gap: var(--kg-space-2); }
.kg-field-label { font: var(--kg-type-caption); color: var(--kg-text-3); letter-spacing: var(--kg-track-caption); }

/* ---- Search (combobox) ------------------------------------------------------ */
.kg-search { position: relative; width: 420px; max-width: 40vw; }
.kg-search-input {
  width: 100%; height: var(--kg-size-control); padding: 0 64px 0 32px;
  font: var(--kg-type-body); font-family: var(--kg-font-sans); color: var(--kg-text);
  background: var(--kg-surface-2); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md);
  transition: border-color var(--kg-motion-fast) var(--kg-ease), background var(--kg-motion-fast) var(--kg-ease);
}
.kg-search-input::placeholder { color: var(--kg-text-3); }
.kg-search-input:hover { border-color: var(--kg-border-strong); }
.kg-search-input:focus { outline: none; background: var(--kg-surface); border-color: var(--kg-border-focus); box-shadow: 0 0 0 3px var(--kg-accent-soft); }
.kg-search > .kg-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--kg-text-3); pointer-events: none; }
.kg-search > .kg-kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }

/* ---- Popover and menu ------------------------------------------------------- */
.kg-popover {
  position: absolute; z-index: var(--kg-z-popover); min-width: 100%; margin-top: var(--kg-space-1);
  background: var(--kg-surface); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-lg);
  box-shadow: var(--kg-shadow-2); padding: var(--kg-space-1); max-height: 420px; overflow: auto;
  animation: kg-pop var(--kg-motion-base) var(--kg-ease);
}
.kg-menu-group { font: var(--kg-type-overline); letter-spacing: var(--kg-track-overline); text-transform: uppercase; color: var(--kg-text-3); padding: var(--kg-space-2) var(--kg-space-2) var(--kg-space-1); }
.kg-menu-item {
  display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: var(--kg-space-2);
  padding: var(--kg-space-1-5) var(--kg-space-2); border-radius: var(--kg-radius-sm); cursor: pointer; color: var(--kg-text);
}
.kg-menu-item:hover, .kg-menu-item[aria-selected="true"] { background: var(--kg-hover); }
.kg-menu-item[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--kg-accent); }
.kg-menu-item mark { background: none; color: var(--kg-accent-text); font-weight: 600; }
.kg-menu-item small { color: var(--kg-text-3); font: var(--kg-type-caption); }
.kg-menu-foot { display: flex; gap: var(--kg-space-3); padding: var(--kg-space-2); border-top: 1px solid var(--kg-border); margin-top: var(--kg-space-1); color: var(--kg-text-3); font: var(--kg-type-caption); }

/* ---- Buttons ---------------------------------------------------------------- */
.kg-btn {
  text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--kg-space-1-5);
  height: var(--kg-size-control); padding: 0 var(--kg-space-3); white-space: nowrap; cursor: pointer;
  font: var(--kg-type-body-strong); font-family: var(--kg-font-sans); color: var(--kg-text);
  background: var(--kg-surface); border: 1px solid var(--kg-border-strong); border-radius: var(--kg-radius-md);
  transition: background var(--kg-motion-fast) var(--kg-ease), border-color var(--kg-motion-fast) var(--kg-ease), color var(--kg-motion-fast) var(--kg-ease);
}
.kg-btn:hover { background: var(--kg-hover); }
.kg-btn:active { transform: translateY(0.5px); }
.kg-btn[disabled], .kg-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.kg-btn--primary { background: var(--kg-accent); border-color: transparent; color: var(--kg-text-on-accent); }
.kg-btn--primary:hover { background: var(--kg-accent-hover); }
.kg-btn--ghost { background: transparent; border-color: transparent; color: var(--kg-text-2); }
.kg-btn--ghost:hover { background: var(--kg-hover); color: var(--kg-text); }
.kg-btn--sm { height: var(--kg-size-control-sm); padding: 0 var(--kg-space-2); font: var(--kg-type-small); font-weight: 500; border-radius: var(--kg-radius-sm); }
.kg-btn--icon { width: var(--kg-size-control); padding: 0; }
.kg-btn--icon.kg-btn--sm { width: var(--kg-size-control-sm); }
.kg-btn[aria-pressed="true"] { background: var(--kg-selected); border-color: var(--kg-accent-line); color: var(--kg-text); }

/* ---- Segmented control (depth 1-5, colour by, view) ------------------------- */
.kg-seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--kg-surface-3); border-radius: var(--kg-radius-md); }
.kg-seg button {
  min-width: 26px; height: calc(var(--kg-size-control) - 4px); padding: 0 var(--kg-space-2); border: 0; border-radius: var(--kg-radius-sm);
  background: transparent; color: var(--kg-text-2); font: var(--kg-type-small); font-weight: 500; font-family: var(--kg-font-sans); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.kg-seg button:hover { color: var(--kg-text); }
.kg-seg button[aria-pressed="true"] { background: var(--kg-surface); color: var(--kg-text); box-shadow: var(--kg-shadow-1); }

/* ---- Inputs, selects, toggles ---------------------------------------------- */
.kg-input, .kg-select {
  height: var(--kg-size-control); padding: 0 var(--kg-space-2-5, 10px); font: var(--kg-type-body); font-family: var(--kg-font-sans);
  color: var(--kg-text); background: var(--kg-surface); border: 1px solid var(--kg-border-strong); border-radius: var(--kg-radius-md);
}
.kg-input:focus, .kg-select:focus { outline: none; border-color: var(--kg-border-focus); box-shadow: 0 0 0 3px var(--kg-accent-soft); }
.kg-select { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--kg-text-3) 50%), linear-gradient(135deg, var(--kg-text-3) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.kg-toggle { display: inline-flex; align-items: center; gap: var(--kg-space-1-5); height: var(--kg-size-control-sm); padding: 0 var(--kg-space-2); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-full); font: var(--kg-type-small); color: var(--kg-text-3); cursor: pointer; user-select: none; background: transparent; }
.kg-toggle[aria-pressed="true"] { color: var(--kg-text); border-color: var(--kg-border-strong); background: var(--kg-surface); }
.kg-toggle .kg-swatch { opacity: .35; }
.kg-toggle[aria-pressed="true"] .kg-swatch { opacity: 1; }
.kg-range { accent-color: var(--kg-accent); width: 96px; }

/* ---- Kbd -------------------------------------------------------------------- */
.kg-kbd { display: inline-flex; align-items: center; gap: 2px; height: 18px; padding: 0 5px; font: var(--kg-type-caption); font-family: var(--kg-font-mono); color: var(--kg-text-3); background: var(--kg-surface); border: 1px solid var(--kg-border); border-bottom-width: 2px; border-radius: var(--kg-radius-xs); }

/* ---- Entity (a table, column, concept or metric name) ------------------------ */
.kg-entity { display: inline-flex; align-items: center; gap: var(--kg-space-1-5); min-width: 0; font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-size); color: var(--kg-text); }
.kg-entity-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-entity-schema { color: var(--kg-text-3); }
.kg-entity-schema::after { content: "."; }
a.kg-entity { text-decoration: none; cursor: pointer; border-radius: var(--kg-radius-xs); }
a.kg-entity:hover .kg-entity-name { text-decoration: underline; text-decoration-color: var(--kg-accent-line); text-underline-offset: 3px; }

/* Glyphs: the same four shapes the graph uses, so the list and the canvas read as one language. */
.kg-glyph { width: 12px; height: 12px; flex: none; display: inline-block; }
.kg-glyph--table   { border-radius: 3px; background: var(--kg-glyph-color, var(--kg-graph-node-ink)); }
.kg-glyph--column  { width: 8px; height: 8px; margin: 2px; border-radius: 50%; background: var(--kg-graph-column); }
.kg-glyph--concept { width: 9px; height: 9px; margin: 1.5px; transform: rotate(45deg); border: 1.5px solid var(--kg-graph-concept); border-radius: 2px; }
.kg-glyph--metric  { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); background: var(--kg-graph-metric); }
.kg-glyph--schema  { border-radius: 50%; background: var(--kg-glyph-color, var(--kg-text-3)); }
.kg-swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; background: var(--kg-glyph-color, var(--kg-text-3)); }

/* ---- Chips and badges ------------------------------------------------------- */
.kg-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; white-space: nowrap;
  font: var(--kg-type-caption); letter-spacing: 0; color: var(--kg-text-2);
  background: var(--kg-surface-2); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-full);
}
.kg-chip--mono { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); font-weight: 400; }
/* Edge kind chips carry a tiny line sample: solid, dashed, dotted, dash-dot. */
.kg-chip[data-kind]::before { content: ""; width: 14px; height: 0; border-top: 2px solid currentColor; }
.kg-chip[data-kind="declared"] { color: var(--kg-graph-edge-declared); }
.kg-chip[data-kind="inferred"] { color: var(--kg-graph-edge-inferred); }
.kg-chip[data-kind="inferred"]::before { border-top-style: dashed; }
.kg-chip[data-kind="concept"]  { color: var(--kg-graph-edge-concept); }
.kg-chip[data-kind="concept"]::before { border-top-style: dotted; }
.kg-chip[data-kind="polymorphic"] { color: var(--kg-graph-edge-poly); }
.kg-chip[data-kind="polymorphic"]::before { border-top: 0; height: 2px; background: repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 3px, currentColor 3px 8px, transparent 8px 10px); }
.kg-chip[data-kind] > span { color: var(--kg-text-2); }
.kg-chip--warn { color: var(--kg-warning); background: var(--kg-warning-soft); border-color: transparent; }

.kg-badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; font: var(--kg-type-caption); font-weight: 600; letter-spacing: var(--kg-track-caption); border-radius: var(--kg-radius-xs); }
.kg-badge--verified { color: var(--kg-success); background: var(--kg-success-soft); }
.kg-badge--unverified { color: var(--kg-text-2); background: var(--kg-surface-3); }
.kg-badge--pii { color: var(--kg-danger); background: var(--kg-danger-soft); }
.kg-badge--fanout { color: var(--kg-warning); background: var(--kg-warning-soft); }

/* Key tags in column lists: PK, UK, FK, IX, plus the index position (IX 2). */
.kg-key { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; font: 600 10px/16px var(--kg-font-mono); letter-spacing: .02em; border-radius: var(--kg-radius-xs); color: var(--kg-text-2); background: var(--kg-surface-3); }
.kg-key--pk { color: var(--kg-text-on-accent); background: var(--kg-accent); }
.kg-key--uk { color: var(--kg-accent-text); background: var(--kg-accent-soft); }
.kg-key--fk { color: var(--kg-info); background: var(--kg-info-soft); }

/* Confidence: the number in mono plus a 4-step meter. Bands: high >= .9, medium >= .7, low. */
.kg-conf { display: inline-flex; align-items: center; gap: 5px; font: var(--kg-type-caption); font-family: var(--kg-font-mono); font-weight: 500; color: var(--kg-text-2); font-variant-numeric: tabular-nums; }
.kg-conf-meter { display: inline-grid; grid-template-columns: repeat(4, 3px); gap: 1.5px; align-items: end; height: 10px; }
.kg-conf-meter i { display: block; background: var(--kg-border-strong); border-radius: 1px; }
.kg-conf-meter i:nth-child(1) { height: 4px; } .kg-conf-meter i:nth-child(2) { height: 6px; } .kg-conf-meter i:nth-child(3) { height: 8px; } .kg-conf-meter i:nth-child(4) { height: 10px; }
.kg-conf[data-band="high"] .kg-conf-meter i { background: var(--kg-text-2); }
.kg-conf[data-band="medium"] .kg-conf-meter i:nth-child(-n+3) { background: var(--kg-text-2); }
.kg-conf[data-band="low"] { color: var(--kg-warning); }
.kg-conf[data-band="low"] .kg-conf-meter i:nth-child(-n+2) { background: var(--kg-warning); }

/* ---- Side panel ------------------------------------------------------------- */
.kg-panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--kg-surface); border-left: 1px solid var(--kg-border); }
.kg-panel-head { padding: var(--kg-space-4) var(--kg-space-5) var(--kg-space-3); border-bottom: 1px solid var(--kg-border); }
.kg-panel-kicker { display: flex; align-items: center; gap: var(--kg-space-2); margin-bottom: var(--kg-space-1-5); }
.kg-panel-title { margin: 0; font: var(--kg-type-mono-title); font-family: var(--kg-font-mono); letter-spacing: var(--kg-track-mono-title); word-break: break-word; }
.kg-panel-title .kg-entity-schema { font-weight: 400; }
.kg-panel-meta { display: flex; flex-wrap: wrap; gap: var(--kg-space-1) var(--kg-space-3); margin-top: var(--kg-space-2); font: var(--kg-type-small); color: var(--kg-text-2); }
.kg-panel-meta b { color: var(--kg-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.kg-panel-actions { display: flex; gap: var(--kg-space-1-5); margin-top: var(--kg-space-3); }
.kg-panel-body { flex: 1; overflow: auto; overscroll-behavior: contain; }
.kg-panel-body::-webkit-scrollbar { width: 10px; } .kg-panel-body::-webkit-scrollbar-thumb { background: var(--kg-border); border: 3px solid var(--kg-surface); border-radius: 10px; }

/* Collapsible section: <details class="kg-section" open><summary>…</summary>…</details> */
.kg-section { border-bottom: 1px solid var(--kg-border); }
.kg-section > summary {
  display: flex; align-items: center; gap: var(--kg-space-2); list-style: none; cursor: pointer; user-select: none;
  padding: var(--kg-space-3) var(--kg-space-5); font: var(--kg-type-overline); letter-spacing: var(--kg-track-overline); text-transform: uppercase; color: var(--kg-text-2);
}
.kg-section > summary::-webkit-details-marker { display: none; }
.kg-section > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid var(--kg-text-3); border-bottom: 1.5px solid var(--kg-text-3); transform: rotate(-45deg); transition: transform var(--kg-motion-fast) var(--kg-ease); }
.kg-section[open] > summary::after { transform: rotate(45deg); }
.kg-section > summary:hover { color: var(--kg-text); }
.kg-section-count { font: var(--kg-type-caption); font-family: var(--kg-font-mono); color: var(--kg-text-3); text-transform: none; letter-spacing: 0; }
.kg-section-body { padding: 0 var(--kg-space-5) var(--kg-space-4); }
.kg-section-body--flush { padding: 0 0 var(--kg-space-3); }

/* Key-value list (context, column semantics). */
.kg-kv { display: grid; grid-template-columns: 92px 1fr; gap: var(--kg-space-2) var(--kg-space-3); margin: 0; font: var(--kg-type-body); }
.kg-kv dt { color: var(--kg-text-3); font: var(--kg-type-small); padding-top: 1px; }
.kg-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kg-kv code { font-size: var(--kg-type-mono-small-size); padding: 1px 4px; background: var(--kg-surface-3); border-radius: var(--kg-radius-xs); }

.kg-callout { display: grid; grid-template-columns: 16px 1fr; gap: var(--kg-space-2); padding: var(--kg-space-3); border-radius: var(--kg-radius-md); font: var(--kg-type-body); background: var(--kg-surface-2); border: 1px solid var(--kg-border); }
.kg-callout--pitfall { background: var(--kg-warning-soft); border-color: transparent; }
.kg-callout--pitfall > .kg-icon { color: var(--kg-warning); }
.kg-callout p { margin: 0 0 var(--kg-space-1-5); } .kg-callout p:last-child { margin: 0; }
.kg-source { font: var(--kg-type-caption); color: var(--kg-text-3); margin-top: var(--kg-space-2); }

/* ---- Data table ------------------------------------------------------------- */
.kg-table { width: 100%; border-collapse: separate; border-spacing: 0; font: var(--kg-type-small); }
.kg-table th { position: sticky; top: 0; z-index: 1; text-align: left; font: var(--kg-type-caption); letter-spacing: var(--kg-track-caption); color: var(--kg-text-3); background: var(--kg-surface); padding: var(--kg-space-1-5) var(--kg-space-2); border-bottom: 1px solid var(--kg-border); white-space: nowrap; }
.kg-table td { padding: var(--kg-space-1-5) var(--kg-space-2); border-bottom: 1px solid var(--kg-border); vertical-align: top; }
.kg-table tr:last-child td { border-bottom: 0; }
.kg-table tbody tr:hover td { background: var(--kg-hover); }
.kg-table tbody tr[aria-selected="true"] td { background: var(--kg-selected); }
.kg-table th:first-child, .kg-table td:first-child { padding-left: var(--kg-space-5); }
.kg-table th:last-child, .kg-table td:last-child { padding-right: var(--kg-space-5); }
.kg-table .kg-c-mono { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); }
.kg-table .kg-c-num { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); }
.kg-table .kg-c-type { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); color: var(--kg-text-3); white-space: nowrap; }
.kg-table .kg-c-keys { white-space: nowrap; width: 1%; }
.kg-table--clickable tbody tr { cursor: pointer; }

/* ---- Relation row ----------------------------------------------------------- */
.kg-rel { padding: var(--kg-space-2-5, 10px) var(--kg-space-5); border-bottom: 1px solid var(--kg-border); }
.kg-rel:hover { background: var(--kg-hover); }
.kg-rel-line { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: var(--kg-space-2); }
.kg-rel-dir { color: var(--kg-text-3); }
.kg-rel-join { margin: 3px 0 0 24px; font: var(--kg-type-caption); font-family: var(--kg-font-mono); color: var(--kg-text-2); }
.kg-rel-join .o { color: var(--kg-text-3); padding: 0 3px; }
.kg-rel-tags { display: flex; flex-wrap: wrap; gap: var(--kg-space-1); margin: 6px 0 0 24px; }
.kg-rel-evidence { margin: 6px 0 0 24px; }
.kg-rel-evidence > summary { list-style: none; cursor: pointer; font: var(--kg-type-caption); color: var(--kg-text-3); }
.kg-rel-evidence > summary::-webkit-details-marker { display: none; }
.kg-rel-evidence > summary:hover { color: var(--kg-text); }
.kg-rel-evidence ul { margin: var(--kg-space-1-5) 0 0; padding: 0; list-style: none; }
.kg-rel-evidence li { position: relative; padding-left: 14px; font: var(--kg-type-small); color: var(--kg-text-2); margin-bottom: 2px; }
.kg-rel-evidence li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--kg-success); }
.kg-rel-evidence li[data-sign="-"]::before { background: var(--kg-warning); }

/* ---- Reachable-by-level list ------------------------------------------------ */
.kg-level { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: var(--kg-space-2); padding: var(--kg-space-1-5) var(--kg-space-5); cursor: pointer; }
.kg-level:hover { background: var(--kg-hover); }
.kg-hop { display: inline-grid; place-items: center; width: 22px; height: 18px; font: 600 10.5px/1 var(--kg-font-mono); border-radius: var(--kg-radius-xs); color: var(--kg-text-2); background: var(--kg-surface-3); }
.kg-hop[data-hop="0"] { background: var(--kg-accent); color: var(--kg-text-on-accent); }
.kg-hop[data-hop="1"] { background: var(--kg-graph-node-ink); color: var(--kg-surface); }

/* ---- Value profile ---------------------------------------------------------- */
.kg-profile-row { display: grid; grid-template-columns: minmax(0, 120px) 1fr 52px; align-items: center; gap: var(--kg-space-2); margin-bottom: 5px; font: var(--kg-type-small); }
.kg-profile-row > :first-child { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-profile-bar { height: 8px; border-radius: 2px; background: var(--kg-surface-3); overflow: hidden; }
.kg-profile-bar > i { display: block; height: 100%; background: var(--kg-text-2); border-radius: 2px; }
.kg-profile-row > :last-child { text-align: right; font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); color: var(--kg-text-2); font-variant-numeric: tabular-nums; }
.kg-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--kg-border); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); overflow: hidden; margin-bottom: var(--kg-space-3); }
.kg-stat { background: var(--kg-surface); padding: var(--kg-space-2) var(--kg-space-3); }
.kg-stat b { display: block; font: var(--kg-type-body-strong); font-family: var(--kg-font-mono); font-variant-numeric: tabular-nums; }
.kg-stat span { font: var(--kg-type-caption); color: var(--kg-text-3); }

/* ---- Code block (SQL JOIN) -------------------------------------------------- */
.kg-code { position: relative; margin: 0; padding: var(--kg-space-3) var(--kg-space-4); background: var(--kg-code-bg); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); font: var(--kg-type-mono); font-family: var(--kg-font-mono); overflow-x: auto; white-space: pre; tab-size: 2; color: var(--kg-code-ident); }
.kg-code .k { color: var(--kg-code-keyword); font-weight: 600; }
.kg-code .o { color: var(--kg-code-op); }
.kg-code .a { color: var(--kg-code-alias); }
.kg-code .c { color: var(--kg-text-3); font-style: italic; }
.kg-code-copy { position: absolute; top: 6px; right: 6px; }

/* ---- Tabs ------------------------------------------------------------------- */
.kg-tabs { display: flex; gap: var(--kg-space-4); padding: 0 var(--kg-space-5); border-bottom: 1px solid var(--kg-border); }
.kg-tab { position: relative; padding: var(--kg-space-2-5, 10px) 0; border: 0; background: none; cursor: pointer; font: var(--kg-type-body-strong); font-family: var(--kg-font-sans); color: var(--kg-text-3); }
.kg-tab:hover { color: var(--kg-text); }
.kg-tab[aria-selected="true"] { color: var(--kg-text); }
.kg-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--kg-text); border-radius: 2px; }
.kg-tab .kg-section-count { margin-left: 4px; }

/* ---- Canvas and its overlays ------------------------------------------------ */
.kg-canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; background-color: var(--kg-canvas); background-image: radial-gradient(var(--kg-canvas-dot) 1px, transparent 1.2px); background-size: 20px 20px; }
.kg-canvas > .kg-cy { position: absolute; inset: 0; }
.kg-overlay { position: absolute; z-index: var(--kg-z-overlay); background: var(--kg-surface); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-lg); box-shadow: var(--kg-shadow-1); }
.kg-overlay--tl { top: var(--kg-space-3); left: var(--kg-space-3); }
.kg-overlay--tr { top: var(--kg-space-3); right: var(--kg-space-3); }
.kg-overlay--bl { bottom: var(--kg-space-3); left: var(--kg-space-3); }
.kg-overlay--br { bottom: var(--kg-space-3); right: var(--kg-space-3); }
.kg-crumbs { display: flex; align-items: center; gap: var(--kg-space-1); padding: var(--kg-space-1) var(--kg-space-2); font: var(--kg-type-small); }
.kg-crumbs a { color: var(--kg-text-2); text-decoration: none; padding: 2px 4px; border-radius: var(--kg-radius-xs); cursor: pointer; font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); }
.kg-crumbs a:hover { background: var(--kg-hover); color: var(--kg-text); }
.kg-crumbs [aria-current] { color: var(--kg-text); font-weight: 550; }
.kg-crumbs .sep { color: var(--kg-text-3); }
.kg-zoom { display: flex; flex-direction: column; padding: 2px; }
.kg-legend { padding: var(--kg-space-3); font: var(--kg-type-caption); color: var(--kg-text-2); min-width: 180px; }
.kg-legend h4 { margin: 0 0 var(--kg-space-1-5); font: var(--kg-type-overline); letter-spacing: var(--kg-track-overline); text-transform: uppercase; color: var(--kg-text-3); }
.kg-legend-row { display: flex; align-items: center; gap: var(--kg-space-2); height: 20px; }
.kg-legend-row svg { width: 24px; height: 12px; flex: none; }
.kg-legend--inline { display: flex; gap: var(--kg-space-4); padding: var(--kg-space-1-5) var(--kg-space-3); min-width: 0; }
.kg-legend-group + .kg-legend-group { margin-top: var(--kg-space-2); padding-top: var(--kg-space-2); border-top: 1px solid var(--kg-border); }

/* ---- Status bar ------------------------------------------------------------- */
.kg-statusbar { display: flex; align-items: center; gap: var(--kg-space-4); padding: 0 var(--kg-space-4); background: var(--kg-surface); border-top: 1px solid var(--kg-border); font: var(--kg-type-caption); color: var(--kg-text-3); font-variant-numeric: tabular-nums; }
.kg-statusbar b { color: var(--kg-text-2); font-weight: 550; }
.kg-statusbar .kg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--kg-success); display: inline-block; margin-right: 4px; }

/* ---- Tooltip (graph hover) -------------------------------------------------- */
.kg-tip { position: fixed; z-index: var(--kg-z-toast); pointer-events: none; max-width: 340px; padding: var(--kg-space-2) var(--kg-space-3); background: var(--kg-surface-inverse); color: var(--kg-text-inverse); border-radius: var(--kg-radius-md); box-shadow: var(--kg-shadow-2); font: var(--kg-type-small); }
.kg-tip .kg-entity { color: inherit; }
.kg-tip .kg-entity-schema { color: inherit; opacity: .6; }
.kg-tip-meta { margin-top: 2px; opacity: .7; font: var(--kg-type-caption); }

/* ---- States: empty, loading, error, toast ----------------------------------- */
.kg-empty { display: grid; justify-items: center; gap: var(--kg-space-2); padding: var(--kg-space-10) var(--kg-space-6); text-align: center; color: var(--kg-text-2); }
.kg-empty > svg { width: 48px; height: 48px; color: var(--kg-text-3); stroke-width: 1.25; }
.kg-empty h3 { margin: var(--kg-space-2) 0 0; font: var(--kg-type-title); color: var(--kg-text); }
.kg-empty p { margin: 0; max-width: 320px; font: var(--kg-type-body); }
.kg-empty .kg-toolbar { margin-top: var(--kg-space-3); }
.kg-skeleton { display: block; height: 12px; border-radius: var(--kg-radius-xs); background: linear-gradient(90deg, var(--kg-surface-3) 0%, var(--kg-surface-2) 50%, var(--kg-surface-3) 100%); background-size: 200% 100%; animation: kg-shimmer 1.2s linear infinite; }
.kg-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--kg-border-strong); border-top-color: var(--kg-text); animation: kg-spin .7s linear infinite; display: inline-block; }
.kg-error { display: grid; grid-template-columns: 16px 1fr; gap: var(--kg-space-2); padding: var(--kg-space-3); border-radius: var(--kg-radius-md); background: var(--kg-danger-soft); color: var(--kg-text); font: var(--kg-type-body); }
.kg-error > .kg-icon { color: var(--kg-danger); }
.kg-toast { position: fixed; left: 50%; bottom: calc(var(--kg-size-statusbar) + var(--kg-space-4)); transform: translateX(-50%); z-index: var(--kg-z-toast); display: flex; align-items: center; gap: var(--kg-space-2); padding: var(--kg-space-2) var(--kg-space-3); background: var(--kg-surface-inverse); color: var(--kg-text-inverse); border-radius: var(--kg-radius-md); box-shadow: var(--kg-shadow-3); font: var(--kg-type-small); animation: kg-pop var(--kg-motion-base) var(--kg-ease); }

@keyframes kg-pop { from { opacity: 0; transform: translateY(-2px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes kg-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes kg-spin { to { transform: rotate(360deg); } }
.kg-toast { animation-name: kg-toast-in; }
@keyframes kg-toast-in { from { opacity: 0; transform: translate(-50%, 4px); } to { opacity: 1; transform: translate(-50%, 0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }
}
@media print {
  .kg-header, .kg-statusbar, .kg-overlay { display: none; }
}

/* ===== Views ================================================================== */

/* ---- Left rail -------------------------------------------------------------- */
.kg-rail { display: flex; flex-direction: column; min-height: 0; background: var(--kg-surface); border-right: 1px solid var(--kg-border); }
.kg-rail-brand { display: flex; align-items: center; height: var(--kg-size-header); padding: 0 var(--kg-space-4); border-bottom: 1px solid var(--kg-border); }
.kg-rail-brand svg { height: 22px; width: auto; }
.kg-rail-search { text-decoration: none; margin: var(--kg-space-3) var(--kg-space-3) var(--kg-space-2); display: flex; align-items: center; gap: var(--kg-space-2); height: var(--kg-size-control); padding: 0 var(--kg-space-2); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); background: var(--kg-surface-2); color: var(--kg-text-3); font: var(--kg-type-body); cursor: text; }
.kg-rail-search:hover { border-color: var(--kg-border-strong); }
.kg-rail-search[aria-current="page"] { border-color: var(--kg-border-focus); background: var(--kg-surface); color: var(--kg-text); }
.kg-rail-search .kg-kbd { margin-left: auto; }
.kg-nav { display: grid; gap: 1px; padding: 0 var(--kg-space-2); }
.kg-nav-item { display: flex; align-items: center; gap: var(--kg-space-2-5); height: 30px; padding: 0 var(--kg-space-2); border-radius: var(--kg-radius-sm); color: var(--kg-text-2); font: var(--kg-type-body-strong); font-family: var(--kg-font-sans); text-decoration: none; cursor: pointer; border: 0; background: none; width: 100%; }
.kg-nav-item:hover { background: var(--kg-hover); color: var(--kg-text); }
.kg-nav-item[aria-current="page"] { background: var(--kg-surface-3); color: var(--kg-text); }
.kg-nav-item .kg-section-count { margin-left: auto; }
.kg-rail-group { padding: var(--kg-space-4) var(--kg-space-4) var(--kg-space-1-5); }
.kg-rail-list { display: grid; padding: 0 var(--kg-space-2); overflow: auto; min-height: 0; }
.kg-rail-list a { display: flex; align-items: center; gap: var(--kg-space-2); height: 26px; padding: 0 var(--kg-space-2); border-radius: var(--kg-radius-sm); color: var(--kg-text-2); font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kg-rail-list a:hover { background: var(--kg-hover); color: var(--kg-text); }
.kg-rail-foot { margin-top: auto; padding: var(--kg-space-3) var(--kg-space-4); border-top: 1px solid var(--kg-border); display: grid; gap: var(--kg-space-2); }
.kg-switch { display: flex; align-items: center; justify-content: space-between; gap: var(--kg-space-2); font: var(--kg-type-small); color: var(--kg-text-2); cursor: pointer; user-select: none; }
.kg-switch input { appearance: none; width: 28px; height: 16px; border-radius: 8px; background: var(--kg-border-strong); position: relative; cursor: pointer; transition: background var(--kg-motion-fast) var(--kg-ease); margin: 0; flex: none; }
.kg-switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--kg-surface); box-shadow: var(--kg-shadow-1); transition: transform var(--kg-motion-fast) var(--kg-ease); }
.kg-switch input:checked { background: var(--kg-text); }
.kg-switch input:checked::after { transform: translateX(12px); }
.kg-rail-meta { font: var(--kg-type-caption); color: var(--kg-text-3); font-family: var(--kg-font-mono); }

/* ---- View header ------------------------------------------------------------ */
.kg-viewhead > .kg-faint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kg-viewhead { display: flex; align-items: center; gap: var(--kg-space-3); padding: 0 var(--kg-space-4) 0 var(--kg-space-5); background: var(--kg-surface); border-bottom: 1px solid var(--kg-border); min-width: 0; }
.kg-viewhead h1 { margin: 0; font: var(--kg-type-title); letter-spacing: var(--kg-track-title); white-space: nowrap; }
.kg-viewhead h1.kg-mono { font: var(--kg-type-mono-title); letter-spacing: var(--kg-track-mono-title); }
.kg-viewhead .kg-crumbs { padding: 0; margin-left: calc(var(--kg-space-1) * -1); }

/* ---- Diagram viewport (kg-diagram.js) --------------------------------------- */
.kg-viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.kg-viewport.is-panning { cursor: grabbing; }
.kg-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.kg-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.kg-edge, .kg-link { pointer-events: visiblePainted; }
.kg-edge-line { fill: none; stroke: var(--kg-graph-edge-declared); stroke-width: 1.5; opacity: var(--kg-edge-opacity, 1); }
.kg-edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.kg-edge-end { fill: none; stroke: var(--kg-graph-edge-declared); stroke-width: 1.5; opacity: var(--kg-edge-opacity, 1); }
.kg-edge--inferred .kg-edge-line { stroke: var(--kg-graph-edge-inferred); stroke-dasharray: 5 4; }
.kg-edge--inferred .kg-edge-end { stroke: var(--kg-graph-edge-inferred); }
.kg-edge--polymorphic .kg-edge-line { stroke: var(--kg-graph-edge-poly); stroke-dasharray: 1 3 6 3; }
.kg-edge--polymorphic .kg-edge-end { stroke: var(--kg-graph-edge-poly); }
.kg-edge--concept .kg-edge-line { stroke: var(--kg-graph-edge-concept); stroke-dasharray: 1.5 3; stroke-linecap: round; }
.kg-edge-pill { fill: var(--kg-surface); stroke: var(--kg-border); }
.kg-link .kg-edge-pill { stroke: var(--kg-border-strong); }
.kg-edge-pilltext { font: 500 10.5px var(--kg-font-mono); fill: var(--kg-text-2); }
.kg-edge.is-hover .kg-edge-line, .kg-edge.is-hover .kg-edge-end { stroke: var(--kg-graph-edge-path); stroke-width: 2.25; opacity: 1; }
.kg-edge.is-hover .kg-edge-pill { stroke: var(--kg-accent-line); }
.kg-edges.has-hover .kg-edge:not(.is-hover) { opacity: .25; }
.kg-link-line { fill: none; stroke: var(--kg-border-strong); stroke-width: var(--kg-link-w, 1.5px); stroke-linecap: round; opacity: .4; }
.kg-link:hover .kg-link-line { opacity: 1; }
.kg-link:hover .kg-link-line { stroke: var(--kg-text-3); }

/* ---- Table card (Area view node) -------------------------------------------- */
.kg-tcard { position: absolute; background: var(--kg-surface); border: 1px solid var(--kg-border-strong); border-radius: var(--kg-radius-lg); box-shadow: var(--kg-shadow-1); font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); cursor: pointer; transition: border-color var(--kg-motion-fast) var(--kg-ease), box-shadow var(--kg-motion-fast) var(--kg-ease); }
.kg-tcard:hover { border-color: var(--kg-text-3); }
.kg-tcard-head { display: flex; align-items: center; gap: var(--kg-space-2); height: 38px; padding: 0 var(--kg-space-3); border-bottom: 1px solid var(--kg-border); font-weight: 600; font-size: var(--kg-type-mono-size); border-radius: var(--kg-radius-lg) var(--kg-radius-lg) 0 0; }
.kg-tcard-head .kg-glyph--table { width: 10px; height: 10px; }
.kg-tcard-area { margin-left: auto; font: var(--kg-type-caption); font-family: var(--kg-font-sans); color: var(--kg-text-3); font-weight: 500; }
/* header: the table name wins; hub pills shrink first (clipped from the right), then the schema */
.kg-tcard-hubs { display: flex; flex-wrap: nowrap; gap: 3px; margin-left: auto; flex: 0 1000 auto; min-width: 0; overflow: hidden; justify-content: flex-start; }
.kg-tcard-hubs .kg-hub { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 18px; }
.kg-tcard-head .kg-entity-name { flex: 0 1 auto; min-width: 4ch; max-width: 100%; }
.kg-tcard-schema { flex: 0 100 auto; min-width: 2ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: -6px; color: var(--kg-text-3); font-weight: 400; font-size: 11px; }
.kg-tcard-schema::after { content: "."; }
.kg-hub { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--kg-radius-full); font: 500 10.5px/1 var(--kg-font-mono); color: var(--kg-text-2); background: var(--kg-surface-3); white-space: nowrap; }
.kg-tcard-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: var(--kg-space-1-5); height: 24px; padding: 0 var(--kg-space-3); }
.kg-tcard-row .t { color: var(--kg-text-3); font-size: 10.5px; }
.kg-tcard-row.is-linked { background: var(--kg-accent-soft); }
.kg-tcard-more { height: 26px; display: flex; align-items: center; padding: 0 var(--kg-space-3) 0 calc(var(--kg-space-3) + 30px); color: var(--kg-text-3); font-family: var(--kg-font-sans); font-size: 11px; border-top: 1px solid var(--kg-border); }
.kg-tcard[aria-selected="true"], .kg-tcard--focus { border-color: var(--kg-accent-line); box-shadow: 0 0 0 3px var(--kg-accent-soft), var(--kg-shadow-1); }
.kg-tcard--neighbour { border-style: dashed; background: var(--kg-surface-2); box-shadow: none; }
.kg-tcard--neighbour .kg-tcard-head { color: var(--kg-text-2); }

/* ---- Area box (Area map node) ----------------------------------------------- */
.kg-area { position: absolute; padding: var(--kg-space-3) var(--kg-space-3) var(--kg-space-2-5); background: var(--kg-surface); border: 1px solid var(--kg-border-strong); border-radius: var(--kg-radius-xl); box-shadow: var(--kg-shadow-1); cursor: pointer; transition: border-color var(--kg-motion-fast) var(--kg-ease), transform var(--kg-motion-fast) var(--kg-ease); }
.kg-area:hover { border-color: var(--kg-text-3); }
.kg-area-head { display: flex; align-items: baseline; gap: var(--kg-space-2); }
.kg-area-name { font: var(--kg-type-body-strong); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.kg-area-sub { margin-top: 2px; font: var(--kg-type-caption); font-family: var(--kg-font-mono); color: var(--kg-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kg-area--other .kg-area-dots { display: none; }
.kg-area-count { margin-left: auto; flex: none; white-space: nowrap; font: var(--kg-type-caption); font-family: var(--kg-font-mono); color: var(--kg-text-3); }
.kg-area-dots { display: flex; flex-wrap: wrap; gap: 2px; margin: var(--kg-space-2) 0 var(--kg-space-2); align-items: center; }
.kg-area-dots i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--kg-glyph-color); opacity: .85; }
.kg-area-dots b { font: 600 10px/1 var(--kg-font-mono); color: var(--kg-text-3); margin-left: 2px; }
.kg-area-top { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.kg-area-top li { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); color: var(--kg-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; }
.kg-area--other { border-style: dashed; background: var(--kg-surface-2); box-shadow: none; }

/* ---- Neighbouring-tables strip ---------------------------------------------- */
.kg-strip { position: absolute; left: var(--kg-space-3); right: var(--kg-space-3); bottom: var(--kg-space-3); z-index: var(--kg-z-overlay); display: flex; align-items: center; gap: var(--kg-space-2); padding: var(--kg-space-2) var(--kg-space-3); background: var(--kg-surface); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-lg); box-shadow: var(--kg-shadow-2); overflow: hidden; }
.kg-strip-label { font: var(--kg-type-overline); letter-spacing: var(--kg-track-overline); text-transform: uppercase; color: var(--kg-text-3); white-space: nowrap; margin-right: var(--kg-space-1); }
.kg-strip-items { display: flex; gap: var(--kg-space-1-5); overflow: hidden; mask-image: linear-gradient(90deg, #000 90%, transparent); }
.kg-nchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 var(--kg-space-2); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); background: var(--kg-surface); font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); color: var(--kg-text); white-space: nowrap; cursor: pointer; }
.kg-nchip:hover { border-color: var(--kg-border-strong); background: var(--kg-hover); }
.kg-nchip small { font: var(--kg-type-caption); font-family: var(--kg-font-sans); color: var(--kg-text-3); }
.kg-nchip[aria-pressed="true"] { border-style: dashed; border-color: var(--kg-text-3); }
.kg-nchip .plus { color: var(--kg-text-3); }

/* ---- Path view -------------------------------------------------------------- */
.kg-pathbar { display: flex; align-items: center; gap: var(--kg-space-2); padding: var(--kg-space-3) var(--kg-space-5); border-bottom: 1px solid var(--kg-border); background: var(--kg-surface); }
.kg-pathfield { display: flex; align-items: center; gap: var(--kg-space-2); height: var(--kg-size-control); padding: 0 var(--kg-space-2-5); min-width: 220px; border: 1px solid var(--kg-border-strong); border-radius: var(--kg-radius-md); background: var(--kg-surface); font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-size); }
.kg-pathfield > small { font: var(--kg-type-caption); font-family: var(--kg-font-sans); color: var(--kg-text-3); width: 28px; }
.kg-pathscroll { overflow: auto; padding: var(--kg-space-6) var(--kg-space-5) var(--kg-space-8); }
.kg-route-head { display: flex; align-items: center; gap: var(--kg-space-3); margin-bottom: var(--kg-space-4); }
.kg-route-head h2 { margin: 0; font: var(--kg-type-title); }
.kg-chain { display: flex; flex-wrap: wrap; align-items: flex-start; row-gap: var(--kg-space-6); }
.kg-chain-unit { display: flex; align-items: flex-start; }
.kg-chain-card { flex: none; width: 200px; align-self: flex-start; background: var(--kg-surface); border: 1px solid var(--kg-border-strong); border-radius: var(--kg-radius-lg); box-shadow: var(--kg-shadow-1); font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); }
.kg-chain-card--end { border-color: var(--kg-accent-line); box-shadow: 0 0 0 3px var(--kg-accent-soft); }
.kg-chain-card .kg-tcard-head { height: 34px; }
.kg-chain-card .kg-tcard-head .kg-entity-name { flex: 1 1 auto; min-width: 0; }
.kg-chain-card .kg-alias { flex: none; }
.kg-chain-card .kg-tcard-row { position: static; }
.kg-chain-area { padding: 0 var(--kg-space-3) var(--kg-space-2); font: var(--kg-type-caption); font-family: var(--kg-font-sans); color: var(--kg-text-3); }
.kg-step { flex: none; width: 128px; display: flex; flex-direction: column; align-items: center; padding: 30px var(--kg-space-2) 0; text-align: center; }
.kg-step-line { position: relative; width: 100%; height: 0; border-top: 1.5px solid var(--kg-graph-edge-declared); margin: 0 0 var(--kg-space-2); }
.kg-step-line::after { content: ""; position: absolute; right: -1px; top: -5px; width: 8px; height: 8px; border-top: 1.5px solid var(--kg-graph-edge-declared); border-right: 1.5px solid var(--kg-graph-edge-declared); transform: rotate(45deg); }
.kg-step--inferred .kg-step-line { border-top-style: dashed; border-top-color: var(--kg-graph-edge-inferred); }
.kg-step-on { font: var(--kg-type-caption); font-family: var(--kg-font-mono); color: var(--kg-text); line-height: 16px; margin-top: -22px; min-height: 32px; }
.kg-step-on .o { color: var(--kg-text-3); }
.kg-step-meta { display: flex; gap: var(--kg-space-1); justify-content: center; flex-wrap: wrap; margin-top: var(--kg-space-1-5); }
.kg-step-why { margin-top: var(--kg-space-1-5); font: var(--kg-type-caption); color: var(--kg-text-3); line-height: 15px; }
.kg-warn { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: var(--kg-radius-full); font: var(--kg-type-caption); font-weight: 600; color: var(--kg-warning); background: var(--kg-warning-soft); white-space: nowrap; }
.kg-warn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.75; }
.kg-alts { margin-top: var(--kg-space-8); }
.kg-alts h3 { margin: 0 0 var(--kg-space-2); }
.kg-alt { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: var(--kg-space-3); padding: var(--kg-space-2-5) var(--kg-space-3); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); background: var(--kg-surface); margin-bottom: var(--kg-space-1-5); cursor: pointer; }
.kg-alt:hover { border-color: var(--kg-border-strong); }
.kg-alt-route { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-small-size); color: var(--kg-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kg-alt-route b { color: var(--kg-text); font-weight: 500; }
.kg-alt-route .o { color: var(--kg-text-3); padding: 0 4px; }
.kg-alt-warns { display: flex; gap: var(--kg-space-1); }
.kg-rank { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 600 11px/1 var(--kg-font-mono); color: var(--kg-text-2); background: var(--kg-surface-3); }
.kg-rank--best { background: var(--kg-accent); color: var(--kg-text-on-accent); }

/* ---- Document views (Table, Column, Search) --------------------------------- */
.kg-doc { overflow: auto; background: var(--kg-surface); }
.kg-doc-inner { max-width: 1040px; padding: var(--kg-space-6) var(--kg-space-6) var(--kg-space-12); }
@media (max-width: 1365px) { .kg-doc-inner { padding: var(--kg-space-5) var(--kg-space-5) var(--kg-space-10); } }
.kg-doc-head { display: grid; gap: var(--kg-space-2); padding-bottom: var(--kg-space-5); border-bottom: 1px solid var(--kg-border); margin-bottom: var(--kg-space-2); }
.kg-doc-title { margin: 0; font: var(--kg-type-display); font-family: var(--kg-font-mono); font-weight: 600; letter-spacing: -0.03em; }
.kg-doc-title .kg-entity-schema { font-weight: 400; }
.kg-doc-grain { margin: 0; font: var(--kg-type-large); color: var(--kg-text-2); max-width: 640px; }
.kg-doc-facts { display: flex; flex-wrap: wrap; gap: var(--kg-space-2); margin-top: var(--kg-space-1); }
.kg-fact { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--kg-space-2); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); font: var(--kg-type-small); color: var(--kg-text-2); }
.kg-fact b { color: var(--kg-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.kg-doc h2 { margin: var(--kg-space-8) 0 var(--kg-space-3); font: var(--kg-type-title); display: flex; align-items: center; gap: var(--kg-space-2); }
.kg-doc h2 .kg-section-count { font-size: 12px; }
.kg-doc .kg-table th:first-child, .kg-doc .kg-table td:first-child { padding-left: var(--kg-space-2); }
.kg-doc .kg-table th:last-child, .kg-doc .kg-table td:last-child { padding-right: var(--kg-space-2); }
.kg-boxed { border: 1px solid var(--kg-border); border-radius: var(--kg-radius-lg); overflow-x: auto; }
.kg-boxed .kg-table th { background: var(--kg-surface-2); }
.kg-cols-grid td { height: 34px; vertical-align: middle; }
.kg-cols-grid .kg-c-type { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.kg-cols-grid .kg-c-name { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-size); font-weight: 500; white-space: nowrap; }
.kg-flags { display: flex; gap: var(--kg-space-1); flex-wrap: wrap; }
.kg-enum { display: flex; flex-wrap: wrap; gap: 3px; }
.kg-enum code { font-size: 10.5px; padding: 1px 5px; border-radius: var(--kg-radius-xs); background: var(--kg-surface-3); color: var(--kg-text-2); white-space: nowrap; }
.kg-enum code.is-undoc { background: var(--kg-warning-soft); color: var(--kg-warning); }
.kg-minibar { display: inline-block; width: 28px; height: 6px; border-radius: 2px; background: var(--kg-surface-3); vertical-align: middle; overflow: hidden; margin-right: 6px; }
.kg-minibar i { display: block; height: 100%; background: var(--kg-text-3); }
.kg-two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--kg-space-5); }
.kg-relgroup { border: 1px solid var(--kg-border); border-radius: var(--kg-radius-lg); overflow: hidden; }
.kg-relgroup-head { display: flex; align-items: center; gap: var(--kg-space-2); padding: var(--kg-space-2) var(--kg-space-3); background: var(--kg-surface-2); border-bottom: 1px solid var(--kg-border); font: var(--kg-type-small); color: var(--kg-text-2); }
.kg-relgroup-head code { color: var(--kg-text); font-size: var(--kg-type-mono-size); }
.kg-relitem { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--kg-space-2); align-items: center; padding: 0 var(--kg-space-3); height: 34px; border-bottom: 1px solid var(--kg-border); }
.kg-relitem:last-child { border-bottom: 0; }
.kg-relitem:hover { background: var(--kg-hover); }
.kg-relitem-acts { display: flex; gap: 2px; opacity: 0; transition: opacity var(--kg-motion-fast) var(--kg-ease); }
.kg-relitem:hover .kg-relitem-acts { opacity: 1; }
.kg-relcollapsed { display: flex; align-items: center; gap: var(--kg-space-2); padding: 0 var(--kg-space-3); height: 34px; font: var(--kg-type-small); color: var(--kg-text-2); border-bottom: 1px solid var(--kg-border); }
.kg-relcollapsed:last-child { border-bottom: 0; }
.kg-relcollapsed a { color: var(--kg-text); text-decoration: underline; text-decoration-color: var(--kg-border-strong); text-underline-offset: 3px; cursor: pointer; margin-left: auto; }
.kg-hubline { display: flex; flex-wrap: wrap; gap: var(--kg-space-1-5); align-items: center; padding: var(--kg-space-2) var(--kg-space-3); font: var(--kg-type-small); color: var(--kg-text-3); }

/* Search results */
.kg-search-big { position: relative; margin-bottom: var(--kg-space-5); }
.kg-search-big input { width: 100%; height: 44px; padding: 0 var(--kg-space-4) 0 42px; font: var(--kg-type-large); font-size: 16px; font-family: var(--kg-font-sans); color: var(--kg-text); background: var(--kg-surface); border: 1px solid var(--kg-border-focus); border-radius: var(--kg-radius-lg); box-shadow: 0 0 0 3px var(--kg-accent-soft); outline: none; }
.kg-search-big > .kg-icon { position: absolute; left: 14px; top: 14px; color: var(--kg-text-3); }
.kg-search-filters { display: flex; gap: var(--kg-space-1-5); margin-bottom: var(--kg-space-4); }
.kg-result-group { margin-bottom: var(--kg-space-5); }
.kg-result-group > h3 { display: flex; align-items: center; gap: var(--kg-space-2); margin: 0 0 var(--kg-space-1-5); }
.kg-result { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px var(--kg-space-3); align-items: center; padding: var(--kg-space-2) var(--kg-space-3); border-radius: var(--kg-radius-md); cursor: pointer; }
.kg-result:hover, .kg-result[aria-selected="true"] { background: var(--kg-hover); }
.kg-result[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--kg-accent); }
.kg-result-title { font-family: var(--kg-font-mono); font-size: var(--kg-type-mono-size); color: var(--kg-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kg-result-title.is-sans { font-family: var(--kg-font-sans); font-size: 13.5px; font-weight: 550; }
.kg-result-title mark, .kg-result-why mark { background: var(--kg-accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.kg-result-why { grid-column: 2 / 4; font: var(--kg-type-small); color: var(--kg-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kg-result-why b { color: var(--kg-text-2); font-weight: 500; }
.kg-reason { font: var(--kg-type-caption); color: var(--kg-text-3); white-space: nowrap; }

/* Laptop widths: give the canvas room */
/* Under 1366px the rail collapses to icons (56px) and the panel narrows, so the canvas keeps ~880px at 1280. */
.kg-rail-only-collapsed, .kg-rail-mark { display: none; }
@media (max-width: 1365px) {
  :root { --kg-size-rail: 56px; --kg-size-panel: 340px; --kg-size-panel-min: 320px; }
  .kg-rail-brand { padding: 0; justify-content: center; }
  .kg-rail-logo { display: none; } .kg-rail-mark { display: inline-flex; }
  .kg-rail-search { margin: var(--kg-space-3) var(--kg-space-2) var(--kg-space-2); justify-content: center; padding: 0; }
  .kg-nav-label, .kg-rail .kg-section-count, .kg-rail-search .kg-kbd, .kg-rail-group, .kg-rail-list, .kg-rail-foot .kg-switch, .kg-rail-meta { display: none; }
  .kg-nav-item { justify-content: center; padding: 0; }
  .kg-rail-foot { padding: var(--kg-space-3) var(--kg-space-2); justify-items: center; }
  .kg-rail-foot > div { margin: 0 !important; }
  .kg-rail-only-collapsed { display: inline-flex; }
}

.kg-alias { margin-left: auto; font: 500 10.5px/1 var(--kg-font-mono); color: var(--kg-code-alias); padding: 3px 5px; border-radius: var(--kg-radius-xs); background: var(--kg-info-soft); }
.kg-sqlblock { margin-top: var(--kg-space-6); background: var(--kg-surface); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-lg); overflow: hidden; }
.kg-sqlblock-head { display: flex; align-items: center; gap: var(--kg-space-2); padding: var(--kg-space-2) var(--kg-space-2) var(--kg-space-2) var(--kg-space-4); border-bottom: 1px solid var(--kg-border); }
.kg-sqlblock .kg-code { border: 0; border-radius: 0; }
