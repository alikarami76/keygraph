<style>
/* explorer-only additions on top of the keygraph design system */
.kg-entity-schema::after { content: none; }
a.kg-entity, a.kg-link-text { cursor: pointer; }
.kg-link-text { color: inherit; text-decoration: underline; text-decoration-color: var(--kg-border-strong); text-underline-offset: 3px; cursor: pointer; }
.kg-link-text:hover { text-decoration-color: currentColor; }
.kg-viewhead .kg-search { width: 340px; max-width: 38vw; }
.kg-viewhead .kg-search-input { height: 32px; }
.kg-search .kg-popover { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: var(--kg-z-popover, 40); max-height: 70vh; overflow: auto; }
.kg-menu-item { cursor: pointer; }
.kg-loading { display: grid; place-content: center; height: 100vh; gap: 12px; padding: 24px; background: var(--kg-canvas); color: var(--kg-text-2); font: var(--kg-type-small); font-family: var(--kg-font-sans); }
.kg-loading .kg-skeleton { width: 360px; }
.kg-callout-bar { position: absolute; left: 12px; top: 12px; z-index: var(--kg-z-overlay, 10); max-width: min(640px, calc(100% - 24px)); background: var(--kg-surface); box-shadow: var(--kg-shadow-1); align-items: center; }
.kg-pathfield input { border: 0; background: none; outline: none; font: inherit; font-family: var(--kg-font-mono); color: var(--kg-text); min-width: 0; flex: 1; padding: 0; }
.kg-pathfield { position: relative; }
.kg-pathfield .kg-popover { position: absolute; left: 0; min-width: 100%; top: calc(100% + 6px); z-index: var(--kg-z-popover, 40); max-height: 60vh; overflow: auto; }
.kg-alt { cursor: pointer; }
.kg-alt[aria-selected="true"] { border-color: var(--kg-accent-line); }
.kg-cols-grid td.kg-c-name a { color: inherit; text-decoration: none; }
.kg-cols-grid td.kg-c-name a:hover { text-decoration: underline; }
.kg-relitem .kg-entity { min-width: 0; overflow: hidden; }
.kg-list-plain { margin: 0; padding: 0; list-style: none; }
.kg-sel-hint { font: var(--kg-type-caption); color: var(--kg-text-3); white-space: nowrap; }
.kg-other-list { padding: 4px 0; }
.kg-strip .kg-nchip { cursor: pointer; }
pre.kg-code { white-space: pre; overflow: auto; }

.kg-two > div { min-width: 0; }
.kg-rel-join { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-relcollapsed { white-space: nowrap; overflow: hidden; }
/* real-data fixes: name-first rows, middle truncation, wrapped callouts, markup, path chips */
.kg-entity--nf { display: flex; min-width: 0; max-width: 100%; }
.kg-entity--nf .kg-entity-name { flex: 0 1 auto; min-width: 0; }
.kg-nf-schema { flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--kg-text-3); font-size: 11px; }
.kg-level > * { min-width: 0; }
.kg-level-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-rel-line { min-width: 0; } .kg-rel-line > .kg-entity { flex: 1 1 auto; }
.kg-rel-head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-callout, .kg-callout p, .kg-doc-grain, .kg-kv dd, .kg-section-body p { overflow-wrap: anywhere; }
.kg-md-list { margin: 4px 0 0; padding-left: 18px; } .kg-md-list li { margin: 2px 0; }
.kg-callout code, .kg-doc code, .kg-panel code { font-size: .92em; background: var(--kg-surface-3); padding: 0 4px; border-radius: var(--kg-radius-xs); }
.kg-step-warn { color: var(--kg-warning); display: inline-flex; align-items: center; }
.kg-alt-score { display: inline-flex; gap: 8px; align-items: center; }
.kg-pathfield { flex: 1 1 320px; max-width: 420px; }
pre.kg-code { white-space: pre-wrap; overflow-wrap: anywhere; }
.kg-rail .kg-popover .kg-switch { display: flex !important; } /* the collapsed rail hides its switches; the popover shows them */
.kg-badge--unverified { background: var(--kg-warning-soft); color: var(--kg-warning); }
.kg-doc h2 .kg-col-filter { font: var(--kg-type-small); }
a.kg-chip, a.kg-hub { text-decoration: none; color: inherit; }
</style></head>
