<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1f23;--mut:#6b7078;--line:#d9dadd;--acc:#2a62d9;--warn:#b4570a;--hi:#e8eefc}
:root[data-theme=dark]{--bg:#14161a;--panel:#1c1f25;--ink:#e6e8ec;--mut:#99a0ab;--line:#2d3139;--acc:#7aa2ff;--warn:#e8a15a;--hi:#222a3d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--panel:#1c1f25;--ink:#e6e8ec;--mut:#99a0ab;--line:#2d3139;--acc:#7aa2ff;--warn:#e8a15a;--hi:#222a3d}}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:14px}input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
.sw{position:relative}.dd{position:absolute;top:100%;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:340px;max-height:360px;overflow:auto;display:none}
.dd div{padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--line)}.dd div:hover,.dd div.sel{background:var(--hi)}.dd small{color:var(--mut)}
main{flex:1;display:flex;min-height:0}#wrap{flex:1;min-width:0;position:relative}#cy{position:absolute;inset:0}
#side{width:400px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px}
#side h3{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}#side h2{margin:0 0 4px;font-size:15px;word-break:break-all}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}.ctl label{display:flex;gap:3px;align-items:center}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px;color:var(--mut)}.tag.ok{color:#2a8a4a;border-color:#2a8a4a}.tag.no{color:var(--warn);border-color:var(--warn)}
table{border-collapse:collapse;width:100%;table-layout:fixed}td{word-break:break-word}#side{overflow-x:hidden}th{width:96px}td,th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
a.l{color:var(--acc);cursor:pointer;text-decoration:none}a.l:hover{text-decoration:underline}pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;overflow:auto;white-space:pre-wrap}

</style></head><body>
<header>
 <b>keygraph</b>
 <div class="sw"><input id="q" placeholder="Search tables, columns, concepts, metrics..." size="44" autocomplete="off"><div class="dd" id="qdd"></div></div>
 <button id="home">Overview</button>
 <span class="ctl">depth <input id="depth" type="range" min="1" max="5" value="2" style="width:70px"><b id="depthv">2</b>
  min conf <input id="minc" type="range" min="0" max="100" value="40" style="width:80px"><b id="mincv">0.40</b></span>
 <span class="ctl"><label><input type="checkbox" class="kf" value="declared" checked>declared</label><label><input type="checkbox" class="kf" value="inferred" checked>inferred</label><label><input type="checkbox" class="kf" value="concept" checked>concept</label><label><input type="checkbox" id="polyf" checked>polymorphic</label></span>
 <span class="ctl">schema <select id="sch"><option value="">all</option></select> color <select id="colorby"><option value="hop">hop level</option><option value="schema">schema</option></select></span>
 <span class="ctl"><b>Path</b> <div class="sw"><input id="pa" placeholder="from table" size="18"><div class="dd" id="padd"></div></div> <div class="sw"><input id="pb" placeholder="to table" size="18"><div class="dd" id="pbdd"></div></div> <button id="pgo">Find</button></span>
 <button id="theme">Theme</button>
</header>
<main><div id="wrap"><div id="cy"></div><div id="status"></div></div><div id="side"><p style="color:var(--mut)">Search for a table, column, concept or metric. Click a node or a column to focus it; the depth slider sets how many hops are shown.</p></div></main>

<script>/*__CYTOSCAPE__*/</script>
<script>
(async function(){
const $=id=>document.getElementById(id);
const raw=$('kg-data').textContent.trim();
let D;
if(raw.startsWith('GZ:')){const bin=Uint8Array.from(atob(raw.slice(3)),c=>c.charCodeAt(0));D=JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text());}else D=JSON.parse(raw);
const S=D.s,T=D.t,E=D.e,C=D.c;
const tid=i=>S[T[i][1]]+'.'+T[i][0], cname=(t,c)=>T[t][2][c][0];
const idx={};T.forEach((t,i)=>{idx[tid(i)]=i;});
const KIND=['declared','inferred','confirmed','added','probed'],CARDS=['many-to-one','one-to-one','many-to-many','one-to-many'];
const kindOf=e=>e[5]===0?'declared':'inferred';
const flipCard=c=>c===0?3:c===3?0:c;
const norm=s=>String(s||'').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x660).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x6F0).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ً-ٟـ]/g,'').replace(/‌/g,' ').toLowerCase().replace(/[\s_./\\:;,|()\[\]{}-]+/g,' ').trim();
// adjacency
const adj=T.map(()=>[]);E.forEach((e,i)=>{adj[e[0]].push(i);if(e[1]!==e[0])adj[e[1]].push(i);});
const deg=adj.map(a=>a.length);
// context lookups
const tnote={},colsem={},tconcepts=T.map(()=>[]),tmetrics=T.map(()=>[]);
C.tn.forEach(x=>tnote[x.t]=x);C.cols.forEach(x=>colsem[x.t+':'+x.c]=x);
C.concepts.forEach((c,ci)=>c.l.forEach(l=>tconcepts[l[0]].push([ci,l[2],l[1]])));
C.metrics.forEach((m,mi)=>m.t.forEach(t=>tmetrics[t].push(mi)));
// pseudo edges from concept relations (primary-record tables)
const prim={};C.concepts.forEach(c=>c.l.forEach(l=>{if(l[2]==='primary-record')(prim[c.n]=prim[c.n]||[]).push(l[0]);}));
const cedges=[];C.rels.forEach(r=>(prim[r[0]]||[]).forEach(a=>(prim[r[2]]||[]).forEach(b=>{if(a!==b)cedges.push([a,b,r]);})));
const cadj=T.map(()=>[]);cedges.forEach((e,i)=>{cadj[e[0]].push(i);cadj[e[1]].push(i);});
// search index
const ents=[],post=new Map();
function addEnt(k,t,c,label,sub,text,w){const n=norm(text);const id=ents.length;ents.push({k,t,c,label,sub,n,w});for(const tok of new Set(n.split(' '))){if(!tok)continue;let p=post.get(tok);if(!p)post.set(tok,p=[]);p.push(id);}}
T.forEach((t,i)=>{addEnt('t',i,-1,tid(i),'table, '+t[2].length+' columns',tid(i)+' '+(tnote[i]?tnote[i].sm+' '+tnote[i].g:''),3);});
C.concepts.forEach((c,i)=>{addEnt('k',-1,i,c.n,'concept'+(c.dm?' / '+c.dm:''),c.n+' '+c.sy.join(' ')+' '+c.d,3);c.sy.forEach(s=>addEnt('k',-1,i,s,'synonym of '+c.n,s,2.5));});
C.metrics.forEach((m,i)=>addEnt('m',-1,i,m.n,'metric',m.n+' '+m.d,2.5));
T.forEach((t,i)=>t[2].forEach((c,j)=>{const cs=colsem[i+':'+c[0]];addEnt('c',i,j,tid(i)+'.'+c[0],c[1]+(cs&&cs.m?' - '+cs.m.slice(0,60):''),t[0]+' '+c[0]+(cs?' '+cs.m:''),1);}));
const keys=[...post.keys()].sort();
function lb(s){let lo=0,hi=keys.length;while(lo<hi){const m=(lo+hi)>>1;if(keys[m]<s)lo=m+1;else hi=m;}return lo;}
function search(q,onlyTables,limit=12){
 const toks=norm(q).split(' ').filter(Boolean);if(!toks.length)return[];
 let best=null,bc=1e18;
 for(const tk of toks){const lists=[];let cnt=0;for(let i=lb(tk);i<keys.length&&keys[i].startsWith(tk);i++){const p=post.get(keys[i]);lists.push(p);cnt+=p.length;if(cnt>60000)break;}
  if(!lists.length)return[];if(cnt<bc){bc=cnt;best=lists;}}
 const seen=new Set(),res=[];
 for(const l of best)for(const id of l){if(seen.has(id))continue;seen.add(id);const e=ents[id];if(onlyTables&&e.k!=='t')continue;const pad=' '+e.n;
  if(toks.every(t=>pad.includes(' '+t))){let s=e.w;const ln=norm(e.label);if(ln===toks.join(' '))s+=5;else if(ln.startsWith(toks.join(' ')))s+=2;s-=e.n.length/200;res.push([s,id]);}}
 res.sort((a,b)=>b[0]-a[0]);return res.slice(0,limit).map(r=>ents[r[1]]);}
// UI state
const st={depth:2,minc:.4,kinds:{declared:1,inferred:1,concept:1},poly:1,schema:'',colorby:'hop',cur:null,cy:null};
S.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s;$('sch').appendChild(o);});
const PAL=['#4c78a8','#f58518','#54a24b','#e45756','#72b7b2','#b279a2','#9d755d','#bab0ac','#eeca3b','#ff9da6'];
const HOP=['#e4572e','#2a62d9','#2f9e6b','#c9a227','#8a5cc2','#888'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function theme(t){document.documentElement.setAttribute('data-theme',t);}
$('theme').onclick=()=>{const dark=css('--bg')==='#14161a';theme(dark?'light':'dark');if(st.cy)st.cy.style().fromJson(cyStyle()).update();};
function cyStyle(){const ink=css('--ink'),line=css('--mut');return[
 {selector:'node',style:{'label':'data(label)','font-size':10,'color':ink,'text-valign':'bottom','text-margin-y':3,'background-color':'data(color)','width':'data(size)','height':'data(size)','text-wrap':'ellipsis','text-max-width':110}},
 {selector:'node.sel',style:{'border-width':3,'border-color':css('--acc')}},{selector:'node.poly',style:{'border-width':2,'border-color':'#d9534f','border-style':'dashed'}},
 {selector:'edge',style:{'width':'data(w)','opacity':'data(op)','line-color':line,'target-arrow-color':line,'target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':.8}},
 {selector:'edge.inf',style:{'line-style':'dashed'}},{selector:'edge.con',style:{'line-style':'dotted','line-color':'#2f9e6b','target-arrow-color':'#2f9e6b'}},
 {selector:'edge:selected',style:{'line-color':css('--acc'),'width':4}}];}
function ensureCy(){if(st.cy)st.cy.destroy();st.cy=cytoscape({container:$('cy'),style:cyStyle(),wheelSensitivity:.3,elements:[]});
 const tip=$('tip');
 st.cy.on('mouseover','edge',ev=>{const d=ev.target.data();tip.innerHTML='<b>'+esc(d.title)+'</b><br>'+esc(d.kind)+' '+d.conf+', '+esc(d.card)+'<br>'+d.ev.map(x=>'- '+esc(x)).join('<br>');tip.style.display='block';});
 st.cy.on('mousemove','edge',ev=>{const o=ev.originalEvent;tip.style.left=(o.clientX+14)+'px';tip.style.top=(o.clientY+14)+'px';});
 st.cy.on('mouseout','edge',()=>tip.style.display='none');
 st.cy.on('tap','node',ev=>{const d=ev.target.data();if(d.schema!==undefined){showSchema(d.schema);return;}focusTable(d.t,-1);});
 st.cy.on('tap','edge',ev=>{showEdge(ev.target.data());});
 return st.cy;}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setStatus=t=>$('status').textContent=t;
// overview
function overview(){
 const cy=ensureCy();st.cur=null;const els=[];
 if(S.length>1){const cnt=S.map(()=>0);T.forEach(t=>cnt[t[1]]++);const cross={};
  E.forEach(e=>{const a=T[e[0]][1],b=T[e[1]][1];const k=a<b?a+'|'+b:b+'|'+a;cross[k]=(cross[k]||0)+1;});
  S.forEach((s,i)=>els.push({data:{id:'s'+i,schema:i,label:s+' ('+cnt[i]+' tables)',color:PAL[i%PAL.length],size:20+Math.min(60,Math.sqrt(cnt[i])*3)}}));
  Object.entries(cross).forEach(([k,n])=>{const[a,b]=k.split('|').map(Number);els.push({data:{id:'x'+k,source:'s'+a,target:'s'+b,w:1+Math.min(8,Math.log2(n+1)),op:.7,title:S[a]+' - '+S[b],kind:n+' relations',conf:'',card:'',ev:[n+' relations between these schemas']},classes:a===b?'':''});});
  setStatus(T.length+' tables, '+E.length+' relations, '+S.length+' schemas. Click a schema or search.');
 }else{const top=[...T.keys()].sort((a,b)=>deg[b]-deg[a]).slice(0,30);const set=new Set(top);
  top.forEach(i=>els.push(tnode(i,0)));E.forEach((e,i)=>{if(set.has(e[0])&&set.has(e[1]))els.push(eedge(e,i));});
  setStatus('Top 30 tables by relations of '+T.length+'. Search or click to focus.');}
 cy.add(els);cy.layout({name:S.length>1?'circle':'cose',animate:false,padding:30,fit:true}).run();
 $('side').innerHTML=sidePanelIntro();}
function sidePanelIntro(){const s=D.st||{};return '<h2>Overview</h2><p>'+T.length+' tables, '+T.reduce((a,t)=>a+t[2].length,0)+' columns, '+E.length+' relations ('+Object.entries(s.edges_by_kind||{}).map(([k,v])=>v+' '+k).join(', ')+'). Context: '+C.concepts.length+' concepts, '+C.metrics.length+' metrics, '+C.tn.length+' table notes, '+C.cols.length+' column notes.</p><h3>Most connected tables</h3>'+[...T.keys()].sort((a,b)=>deg[b]-deg[a]).slice(0,15).map(i=>'<div><a class="l" data-t="'+i+'">'+esc(tid(i))+'</a> <span class="tag">'+deg[i]+'</span></div>').join('');}
function showSchema(si){const hubs=[...T.keys()].filter(i=>T[i][1]===si).sort((a,b)=>deg[b]-deg[a]).slice(0,30);
 $('side').innerHTML='<h2>'+esc(S[si])+'</h2><p>'+T.filter(t=>t[1]===si).length+' tables. Most connected:</p>'+hubs.map(i=>'<div><a class="l" data-t="'+i+'">'+esc(tid(i))+'</a> <span class="tag">'+deg[i]+'</span></div>').join('');}
function tnode(i,hop,col){return{data:{id:'t'+i,t:i,label:T[i][0],color:st.colorby==='hop'?HOP[Math.min(hop,5)]:PAL[T[i][1]%PAL.length],size:hop===0?30:18+Math.min(14,Math.sqrt(deg[i])*2),hop},classes:(hop===0?'sel ':'')+((st.poly&&T[i][5].length)?'poly':'')};}
function eedge(e,i,virt){const conf=e[4]/100;const near=colsTxt(e[0],e[2]),far=colsTxt(e[1],e[3]);
 return{data:{id:'e'+i,source:'t'+e[0],target:'t'+e[1],w:1+conf*3,op:.35+.65*conf,title:tid(e[0])+'('+near+') -> '+tid(e[1])+'('+far+')',kind:KIND[e[5]],conf:conf.toFixed(2),card:CARDS[e[6]],ev:e[8],ei:i},classes:e[5]===0?'':'inf'};}
const colsTxt=(t,cs)=>cs.map(c=>cname(t,c)).join(',');
// neighborhood BFS
function passEdge(e){if(e[4]/100<st.minc)return false;const k=e[5]===0?'declared':'inferred';if(!st.kinds[k])return false;return true;}
function passSchema(t){return st.schema===''||String(T[t][1])===st.schema;}
function keyCols(t){const s=new Set(T[t][3]);T[t][4].forEach(ix=>{if(ix[1]||ix[2])ix[3].forEach(c=>s.add(c));});return s;}
function bfs(t0,col,depth){
 const hop=new Map([[t0,0]]),via=new Map(),used=new Set(),vused=new Set(),arrive=new Map();let frontier=[t0];
 if(col>=0)arrive.set(t0,new Set([col]));
 for(let d=1;d<=depth;d++){const next=[];
  for(const n of frontier){
   const colMode=col>=0;const allowed=colMode?(d===1?arrive.get(n):new Set([...keyCols(n),...(arrive.get(n)||[])])):null;
   for(const ei of adj[n]){const e=E[ei];if(!passEdge(e))continue;const rev=e[1]===n&&e[0]!==n;const nearC=rev?e[3]:e[2];const far=rev?e[0]:e[1];
    if(colMode&&!nearC.some(c=>allowed.has(c)))continue;if(!passSchema(far)&&far!==t0)continue;
    used.add(ei);if(!hop.has(far)){hop.set(far,d);next.push(far);via.set(far,ei);arrive.set(far,new Set(rev?e[2]:e[3]));}else if(hop.get(far)===d){(arrive.get(far)||arrive.set(far,new Set()).get(far));(rev?e[2]:e[3]).forEach(c=>arrive.get(far).add(c));}}
   if(st.kinds.concept)for(const ci of cadj[n]){const ce=cedges[ci];const far=ce[0]===n?ce[1]:ce[0];if(col>=0&&d===1)continue;if(!passSchema(far))continue;vused.add(ci);if(!hop.has(far)){hop.set(far,d);next.push(far);via.set(far,'c'+ci);}}
  }frontier=next;}
 return{hop,via,used,vused};}
function levels(r){const lv={};r.hop.forEach((h,t)=>{(lv[h]=lv[h]||[]).push(t);});return lv;}
let lastReach=null;
function focusTable(t,col,opts){
 st.cur={t,col};const r=bfs(t,col,st.depth);const cy=ensureCy();let order=[...r.hop.entries()].sort((a,b)=>a[1]-b[1]||deg[b[0]]-deg[a[0]]);let trunc=false;
 if(order.length>300){order=order.slice(0,300);trunc=true;}const keep=new Set(order.map(o=>o[0]));const els=[];
 order.forEach(([i,h])=>els.push(tnode(i,h)));const seenPair={};
 r.used.forEach(ei=>{const e=E[ei];if(!keep.has(e[0])||!keep.has(e[1]))return;const k=e[0]+'|'+e[1];seenPair[k]=(seenPair[k]||0)+1;if(seenPair[k]>3)return;els.push(eedge(e,ei));});
 if(col<0)E.forEach((e,ei)=>{});
 r.vused.forEach(ci=>{const ce=cedges[ci];if(!keep.has(ce[0])||!keep.has(ce[1]))return;els.push({data:{id:'c'+ci,source:'t'+ce[0],target:'t'+ce[1],w:1.5,op:.6,title:ce[2][0]+' '+ce[2][1]+' '+ce[2][2],kind:'concept',conf:'',card:'',ev:['business relation (context)']},classes:'con'});});
 cy.add(els);cy.layout({name:'concentric',concentric:n=>10-(n.data('hop')||0),levelWidth:()=>1,minNodeSpacing:28,animate:false,fit:true,padding:30}).run();
 lastReach=r;const lv=levels(r);setStatus('focus '+tid(t)+(col>=0?'.'+cname(t,col):'')+': '+r.hop.size+' tables within '+st.depth+' hop(s)'+(trunc?' (showing 300)':''));
 showTable(t,col,r);}
// side panel
function showTable(t,col,r){
 const T_=T[t],n=tnote[t];let h='<h2>'+esc(tid(t))+(col>=0?'.'+esc(cname(t,col)):'')+'</h2>';
 h+='<div>'+T_[2].length+' columns, '+deg[t]+' relations'+(T_[5].length?' <span class="tag no">polymorphic</span>':'')+'</div>';
 if(col>=0){const cs=colsem[t+':'+cname(t,col)];h+='<h3>Column</h3><div>'+esc(T_[2][col][1])+'</div>'+(cs?semHtml(cs):'<div class="ev" style="margin:0">no context recorded</div>');}
 if(n){h+='<h3>Context '+vtag(n.v)+'</h3><table>'+[['grain',n.g],['summary',n.sm],['freshness',n.fr],['soft delete',n.sd],['date column',n.dc],['recommended indexes',(n.ri||[]).join(', ')],['pitfalls',n.p],['source',n.s]].filter(x=>x[1]).map(x=>'<tr><th>'+x[0]+'</th><td>'+esc(x[1])+'</td></tr>').join('')+'</table>';}
 else h+='<h3>Context</h3><div class="ev" style="margin:0">no table notes recorded</div>';
 if(tconcepts[t].length)h+='<div>'+tconcepts[t].map(c=>'<span class="tag">'+esc(C.concepts[c[0]].n)+' ('+c[1]+')</span>').join(' ')+'</div>';
 tmetrics[t].forEach(mi=>{const m=C.metrics[mi];h+='<div><b>metric '+esc(m.n)+'</b> '+vtag(m.v)+'<br>'+esc(m.d)+(m.e?'<pre>'+esc(m.e)+'</pre>':'')+(m.cv?'<div class="ev">caveats: '+esc(m.cv)+'</div>':'')+'</div>';});
 h+='<h3>Keys and indexes</h3><div>primary key: '+(T_[3].length?T_[3].map(c=>esc(cname(t,c))).join(', '):'<span class="tag no">none</span>')+'</div>'+T_[4].map(ix=>'<div>'+esc(ix[0])+(ix[1]&&!ix[2]?' [unique]':'')+(ix[2]?' [primary]':'')+': '+ix[3].map(c=>esc(cname(t,c))).join(', ')+'</div>').join('');
 h+='<h3>Relations</h3>'+relTable(t,col);
 if(r){const lv=levels(r);h+='<h3>Reachable by hop <button id="xcsv">CSV</button> <button id="xjson">JSON</button></h3>';
  Object.keys(lv).sort((a,b)=>a-b).filter(k=>k>0).forEach(k=>{h+='<div><b>hop '+k+'</b> ('+lv[k].length+')</div><div>'+lv[k].slice(0,80).map(i=>'<a class="l" data-t="'+i+'">'+esc(tid(i))+'</a>').join(', ')+(lv[k].length>80?' ...':'')+'</div>';});}
 h+='<h3>Columns</h3><div>'+T_[2].slice(0,400).map((c,j)=>'<div><a class="l" data-t="'+t+'" data-c="'+j+'">'+esc(c[0])+'</a> <span class="tag">'+esc(c[1])+'</span>'+(T_[3].includes(j)?' <span class="tag ok">pk</span>':'')+(colsem[t+':'+c[0]]?' <span class="tag">ctx</span>':'')+'</div>').join('')+'</div>';
 $('side').innerHTML=h;
 const rr=r;if($('xcsv'))$('xcsv').onclick=()=>exportReach(rr,'csv');if($('xjson'))$('xjson').onclick=()=>exportReach(rr,'json');}
const vtag=v=>v?'<span class="tag ok">verified</span>':'<span class="tag no">unverified</span>';
function semHtml(cs){return '<table>'+[['meaning',cs.m],['unit',cs.u],['null means',cs.nm],['typical filters',cs.f],['index hint',cs.ih],['PII',cs.pii?'yes':''],['codes',Object.entries(cs.k||{}).map(([a,b])=>a+'='+b).join(', ')],['source',cs.s]].filter(x=>x[1]).map(x=>'<tr><th>'+x[0]+'</th><td>'+esc(x[1])+'</td></tr>').join('')+'</table>'+vtag(cs.v);}
function relTable(t,col){const rows=adj[t].map(ei=>E[ei]).filter(e=>col<0||(e[0]===t&&e[2].includes(col))||(e[1]===t&&e[3].includes(col)));
 if(!rows.length)return'<div class="ev" style="margin:0">none</div>';
 return rows.sort((a,b)=>b[4]-a[4]).slice(0,60).map(e=>{const out=e[0]===t;const o=out?e[1]:e[0];return '<div>'+(out?'&rarr; ':'&larr; ')+'<a class="l" data-t="'+o+'">'+esc(tid(o))+'</a> <span class="tag">'+esc(colsTxt(e[0],e[2]))+' = '+esc(colsTxt(e[1],e[3]))+'</span> <span class="tag '+(e[5]===0?'ok':'')+'">'+KIND[e[5]]+' '+(e[4]/100).toFixed(2)+'</span>'+e[8].map(x=>'<div class="ev">- '+esc(x)+'</div>').join('')+'</div>';}).join('');}
function showEdge(d){$('side').innerHTML='<h2>'+esc(d.title)+'</h2><div>'+esc(d.kind)+' '+d.conf+' '+esc(d.card)+'</div>'+d.ev.map(x=>'<div class="ev">- '+esc(x)+'</div>').join('');}
function exportReach(r,fmt){const rows=[];r.hop.forEach((h,t)=>{if(h===0)return;const v=r.via.get(t);let via='',conf='',kind='';if(typeof v==='number'){const e=E[v];via=tid(e[0])+'('+colsTxt(e[0],e[2])+') -> '+tid(e[1])+'('+colsTxt(e[1],e[3])+')';conf=e[4]/100;kind=KIND[e[5]];}else if(v){kind='concept';}rows.push({hop:h,table:tid(t),via,confidence:conf,kind});});
 rows.sort((a,b)=>a.hop-b.hop||a.table.localeCompare(b.table));let body,mime;
 if(fmt==='json'){body=JSON.stringify(rows,null,1);mime='application/json';}else{body='hop,table,via,confidence,kind\n'+rows.map(x=>[x.hop,x.table,x.via,x.confidence,x.kind].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');mime='text/csv';}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:mime}));a.download='reachable.'+fmt;a.click();}
// paths
function findPaths(a,b,maxHops,minc,k){const heap=[[1,0,a,[]]];const found=[];let pops=0;
 while(heap.length&&found.length<k&&pops<200000){heap.sort((x,y)=>y[0]-x[0]||x[1]-y[1]);const[p,h,node,path]=heap.shift();pops++;if(node===b){found.push([path,p]);continue;}if(h>=maxHops)continue;
  const seen=new Set([a,...path.map(s=>s.far)]);const per={};
  for(const ei of adj[node]){const e=E[ei];const c=e[4]/100;if(c<minc)continue;const rev=e[1]===node&&e[0]!==node;const far=rev?e[0]:e[1];if(seen.has(far))continue;per[far]=(per[far]||0)+1;if(per[far]>2)continue;
   heap.push([p*c,h+1,far,path.concat([{ei,near:node,far,nc:rev?e[3]:e[2],fc:rev?e[2]:e[3],card:rev?flipCard(e[6]):e[6]}])]);}}
 return found;}
function alias(tables){const used={};return tables.map(t=>{const base=T[t][0].split(/[_\W]+/).filter(Boolean).map(w=>w[0]).join('')||'t';used[base]=(used[base]||0)+1;return used[base]===1?base:base+used[base];});}
function sqlFor(a,path){const ts=[a,...path.map(s=>s.far)],al=alias(ts);let s='FROM '+tid(ts[0])+' AS '+al[0];path.forEach((h,i)=>{s+='\nJOIN '+tid(ts[i+1])+' AS '+al[i+1]+' ON '+h.nc.map((c,j)=>al[i]+'.'+cname(h.near,c)+' = '+al[i+1]+'.'+cname(h.far,h.fc[j])).join(' AND ');});return s;}
function showPath(a,b){const ps=findPaths(a,b,4,st.minc>.6?st.minc:.6,3);const cy=ensureCy();let h='<h2>Join paths</h2><div>'+esc(tid(a))+' to '+esc(tid(b))+'</div>';
 if(!ps.length)h+='<p>No path within 4 hops at confidence 0.6 or more. Lower the min-confidence slider (path search uses at least 0.6 here, so try the CLI with --min-confidence).</p>';
 const els=new Map();
 ps.forEach(([path,p],pi)=>{const sql=sqlFor(a,path);h+='<h3>Path '+(pi+1)+' (confidence '+p.toFixed(2)+', '+path.length+' hops)</h3>'+path.map(s=>{const e=E[s.ei];return '<div>'+esc(tid(s.near))+'('+esc(s.nc.map(c=>cname(s.near,c)).join(','))+') &rarr; '+esc(tid(s.far))+'('+esc(s.fc.map(c=>cname(s.far,c)).join(','))+') <span class="tag">'+KIND[e[5]]+' '+(e[4]/100).toFixed(2)+', '+CARDS[s.card]+'</span>'+(s.card===3?' <span class="tag no">fan-out</span>':'')+e[8].map(x=>'<div class="ev">- '+esc(x)+'</div>').join('')+'</div>';}).join('')+'<pre id="sql'+pi+'">'+esc(sql)+'</pre><button class="cp" data-s="'+pi+'">Copy SQL</button>';
  path.forEach(s=>{els.set('t'+s.near,tnode(s.near,pi));els.set('t'+s.far,tnode(s.far,pi));els.set('e'+s.ei,eedge(E[s.ei],s.ei));});});
 if(els.size)els.set('t'+a,tnode(a,0));$('side').innerHTML=h;if(els.size){cy.add([...els.values()]);cy.layout({name:'breadthfirst',roots:'#t'+a,animate:false,fit:true,padding:30}).run();}
 setStatus('path mode: '+ps.length+' path(s)');}
// events
document.addEventListener('click',ev=>{const a=ev.target.closest('a.l');if(a){focusTable(+a.dataset.t,a.dataset.c!==undefined?+a.dataset.c:-1);return;}const b=ev.target.closest('button.cp');if(b){navigator.clipboard&&navigator.clipboard.writeText($('sql'+b.dataset.s).textContent);b.textContent='Copied';}});
function attach(input,dd,pick,onlyTables){let sel=-1,items=[];
 const show=()=>{items=search(input.value,onlyTables);dd.innerHTML=items.map((e,i)=>'<div data-i="'+i+'">'+esc(e.label)+' <small>'+esc(e.sub)+'</small></div>').join('');dd.style.display=items.length?'block':'none';sel=-1;};
 input.addEventListener('input',show);input.addEventListener('focus',show);
 input.addEventListener('keydown',ev=>{const ch=[...dd.children];if(ev.key==='ArrowDown'){sel=Math.min(ch.length-1,sel+1);}else if(ev.key==='ArrowUp'){sel=Math.max(0,sel-1);}else if(ev.key==='Enter'){if(items[Math.max(sel,0)]){pick(items[Math.max(sel,0)]);dd.style.display='none';}return;}else if(ev.key==='Escape'){dd.style.display='none';return;}else return;ch.forEach((c,i)=>c.classList.toggle('sel',i===sel));});
 dd.addEventListener('mousedown',ev=>{const d=ev.target.closest('div[data-i]');if(d){pick(items[+d.dataset.i]);dd.style.display='none';input.value=items[+d.dataset.i].label;}});
 input.addEventListener('blur',()=>setTimeout(()=>dd.style.display='none',150));}
function pickEnt(e){if(e.k==='t')focusTable(e.t,-1);else if(e.k==='c')focusTable(e.t,e.c);else if(e.k==='k'){const c=C.concepts[e.c];const ts=c.l.map(l=>l[0]);showConcept(c,ts);}else if(e.k==='m'){const m=C.metrics[e.c];if(m.t.length)focusTable(m.t[0],-1);}}
function showConcept(c,ts){if(ts.length)focusTable(ts[0],-1);else $('side').innerHTML='<h2>'+esc(c.n)+'</h2><p>'+esc(c.d)+'</p>';}
attach($('q'),$('qdd'),pickEnt,false);
let PA=-1,PB=-1;attach($('pa'),$('padd'),e=>{PA=e.t;},true);attach($('pb'),$('pbdd'),e=>{PB=e.t;},true);
$('pgo').onclick=()=>{if(PA>=0&&PB>=0)showPath(PA,PB);};
$('home').onclick=overview;
$('depth').oninput=e=>{st.depth=+e.target.value;$('depthv').textContent=st.depth;refocus();};
$('minc').oninput=e=>{st.minc=e.target.value/100;$('mincv').textContent=st.minc.toFixed(2);refocus();};
document.querySelectorAll('.kf').forEach(c=>c.onchange=()=>{st.kinds[c.value]=c.checked?1:0;refocus();});
$('polyf').onchange=e=>{st.poly=e.target.checked?1:0;refocus();};$('sch').onchange=e=>{st.schema=e.target.value;refocus();};$('colorby').onchange=e=>{st.colorby=e.target.value;refocus();};
function refocus(){if(st.cur)focusTable(st.cur.t,st.cur.col);}
window.__kg={focus:(name,col,depth)=>{const t=idx[name];const ci=col?T[t][2].findIndex(c=>c[0]===col):-1;if(depth){st.depth=depth;$('depth').value=depth;$('depthv').textContent=depth;}focusTable(t,ci);return{tables:st.cy.nodes().length,edges:st.cy.edges().length,hops:Object.fromEntries(Object.entries(levels(lastReach)).map(([k,v])=>[k,v.map(tid)]))};},
 search:(q)=>search(q,false).map(e=>e.label),path:(a,b)=>{showPath(idx[a],idx[b]);return findPaths(idx[a],idx[b],4,.6,3).length;},tables:T.length,edges:E.length,data:D};
overview();document.body.dataset.ready='1';
})();
