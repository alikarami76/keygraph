name: Bug report (from you or your AI agent)
description: Something in keygraph crashed, failed `keygraph doctor`, or gave a wrong answer. Agents follow setup/BUG_REPORTS.md.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste credentials, connection URLs, data values or SQL with literals. Replace real table and column names with placeholders unless you are happy to share them.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Agent and model
      placeholder: "Claude Code with Opus / Codex / Cursor / ZCode with GLM / OpenCode with a local model / none (CLI)"
  - type: dropdown
    id: source
    attributes:
      label: Source
      options: [postgres, mysql or mariadb, sqlserver, sqlite, clickhouse, mongodb, metabase, information_schema dumps, other]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest command or MCP tool call that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened, with the final error line.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `keygraph doctor --dir <out> --report env.md` (versions and counts only).
      render: markdown
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no credentials, data values or private names I am not allowed to share.
          required: true
